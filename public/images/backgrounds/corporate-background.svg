<!-- Generated corporate background image with SVG -->
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e" />
      <stop offset="100%" stop-color="#283593" />
    </linearGradient>

    <!-- Abstract pattern -->
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>

    <!-- Light effect -->
    <radialGradient id="spotlight" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Grid pattern overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Light effect -->
  <rect width="100%" height="100%" fill="url(#spotlight)" />

  <!-- Abstract geometric shapes -->
  <g opacity="0.1" fill="#ffffff">
