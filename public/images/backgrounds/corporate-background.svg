    <polygon points="2600,1500 2800,1800 2600,2100 2200,2100 2000,1800 2200,1500" />

    <!-- Triangles -->
    <polygon points="800,300 1100,800 500,800" />
    <polygon points="1800,1900 2100,1400 2400,1900" />

